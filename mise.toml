[tools]
python = "3.12"
node = "22"
# Mozilla's extension packaging/signing tool, used by scripts/package-extension.sh --sign
"npm:web-ext" = "latest"

[tasks.test]
description = "Run the Python and extension test suites"
run = [
  "python3 -m unittest discover -s tests -t . -v",
  "node tests/content_script.test.mjs",
  "node tests/background_script.test.mjs",
]

[tasks.test-python]
description = "Run the Python test suite"
run = "python3 -m unittest discover -s tests -t . -v"

[tasks.test-extension]
description = "Run the extension test suites"
run = [
  "node tests/content_script.test.mjs",
  "node tests/background_script.test.mjs",
]

[tasks.package]
description = "Build an unsigned .xpi into dist/ (temporary-load only)"
run = "./scripts/package-extension.sh"

[tasks.sign]
description = "Build and AMO-sign an .xpi into dist/ (needs AMO_JWT_* in mise.local.toml)"
run = "./scripts/package-extension.sh --sign"

[tasks.release]
description = "Publish the signed .xpi + updates.json as a GitHub release"
run = "./scripts/publish-release.sh"
